name: Software release

# Publica uma versão semântica para alterações de produto enviadas a main.
# Release, instalação das skills e funcionamento do Silo são provas distintas.
"on":
  push:
    branches: [main]
    paths-ignore:
      - CODE_OF_CONDUCT.md
      - CONTRIBUTING.md
      - QUICKSTART.md
      - README.md

permissions:
  contents: read

concurrency:
  group: codigo-aberto-software-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Refresh main and tags
        run: git fetch --force origin main --tags

      - name: Plan or apply release state
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pushed=false
          publish=false
          changed=false
          version=""
          anchor=""
          plan_file="$RUNNER_TEMP/release-plan.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for delay in 0 2 8; do
            sleep "$delay"
            git fetch --force origin main --tags
            git checkout --force origin/main

            subject="$(git log -1 --pretty=%s)"
            if [[ "$subject" == chore\(release\):* ]]; then
              python3 scripts/release.py plan > "$plan_file"
            else
              python3 scripts/release.py impact --ref-range HEAD^...HEAD
              if ! python3 scripts/release.py apply > "$plan_file"; then
                cat "$plan_file" >&2
                exit 1
              fi
            fi

            version="$(python3 -c 'import json,sys; p=json.load(open(sys.argv[1])); print(p.get("next_version") or p["current_version"])' "$plan_file")"
            publish="$(python3 -c 'import json,sys; print(str(json.load(open(sys.argv[1]))["publish"]).lower())' "$plan_file")"
            changed="$(python3 -c 'import json,sys; print(str(json.load(open(sys.argv[1]))["changed"]).lower())' "$plan_file")"

            if [[ "$changed" != "true" ]]; then
              pushed=true
              anchor="$(git rev-parse HEAD)"
              break
            fi

            python3 scripts/validate_skills.py
            python3 scripts/release.py validate
            python3 -m unittest tests.test_release tests.test_release_workflow
            python3 scripts/build_chatgpt_smoke_bundle.py

            git add -- .claude-plugin/plugin.json CHANGELOG.md
            git add -u -- .changes
            if [[ "$publish" == "true" ]]; then
              digest="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["fragments_digest"])' "$plan_file")"
              trailers="$(printf 'Release-Protocol: codigo-aberto-release-v1\nRelease-Version: %s\nRelease-Fragments-Digest: %s' "$version" "$digest")"
              git commit -m "chore(release): v${version}" -m "$trailers"
            else
              git commit -m "chore(release): consume no-release fragments"
            fi

            if git push origin HEAD:main; then
              pushed=true
              anchor="$(git rev-parse HEAD)"
              break
            fi
          done

          if [[ "$pushed" != "true" ]]; then
            echo "Could not push a recomputed release state after bounded retries." >&2
            exit 1
          fi

          tag="v${version}"
          git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}" 2>/dev/null || true
          if [[ "$publish" != "true" ]]; then
            if git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null && ! gh release view "$tag" >/dev/null 2>&1; then
              publish=true
              anchor="$(git rev-list -n 1 "$tag")"
            elif [[ "$subject" == "chore(release): v${version}" ]]; then
              publish=true
              anchor="$(git rev-parse HEAD)"
            fi
          fi

          cat "$plan_file" >> "$GITHUB_STEP_SUMMARY"
          {
            echo "publish=$publish"
            echo "version=$version"
            echo "anchor=$anchor"
          } >> "$GITHUB_OUTPUT"

      - name: Publish exact release anchor
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          ANCHOR: ${{ steps.release.outputs.anchor }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          notes_file="$RUNNER_TEMP/release-notes.md"

          git checkout --detach "$ANCHOR"
          python3 scripts/build_chatgpt_smoke_bundle.py

          git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}" 2>/dev/null || true
          if git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null; then
            existing="$(git rev-list -n 1 "$tag")"
            if [[ "$existing" != "$ANCHOR" ]]; then
              echo "Refusing conflicting immutable tag: $tag -> $existing, expected $ANCHOR" >&2
              exit 1
            fi
          else
            git tag -a "$tag" "$ANCHOR" -m "silo-legal ${VERSION}"
            for delay in 1 4 16; do
              git push origin "refs/tags/${tag}" && break
              sleep "$delay"
            done
          fi

          if ! gh release view "$tag" >/dev/null 2>&1; then
            python3 scripts/release.py notes --version "$VERSION" > "$notes_file"
            for delay in 1 4 16; do
              gh release create "$tag" --verify-tag --title "$tag" --notes-file "$notes_file" && break
              sleep "$delay"
            done
          fi

          gh release upload "$tag" \
            dist/chatgpt-work-smoke/*.zip \
            dist/chatgpt-work-smoke/manifest.json \
            --clobber
          gh release view "$tag" >/dev/null
          echo "Published $tag from exact anchor $ANCHOR" >> "$GITHUB_STEP_SUMMARY"
